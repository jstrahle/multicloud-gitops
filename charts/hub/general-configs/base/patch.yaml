apiVersion: batch/v1
kind: Job
metadata:
  name: patch-gitops-operator-env
  namespace: openshift-operators
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      serviceAccountName: gitops-patch-sa
      restartPolicy: Never
      containers:
      - name: patch
        image: image-registry.openshift-image-registry.svc:5000/openshift/cli:latest
        command:
        - /bin/bash
        - -c
        - |
          oc patch deployment openshift-gitops-operator-controller-manager \
            -n openshift-operators \
            --type=json \
            -p='[{
              "op":"add",
              "path":"/spec/template/spec/containers/0/env/-",
              "value":{
                "name":"CLUSTER_SCOPED_ARGO_ROLLOUTS_NAMESPACES",
                "value":"namespace1,namespace2,namespace3"
              }
            }]'
